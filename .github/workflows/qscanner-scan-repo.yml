# .github/workflows/qscanner-scan.yml
#
# Scans source code and a container image with Qualys QScanner during CI,
# and publishes the image scan results to GitHub's Security > Code scanning tab.
#
# Setup required before this workflow will run successfully:
#   1. Create a Qualys API client-id/client-secret (Configurations > API Keys,
#      or as issued for your Code-to-Cloud gateway).
#      Add them as repo secrets named QUALYS_CLIENT_ID and QUALYS_CLIENT_SECRET
#      (Settings > Secrets and variables > Actions > New repository secret)
#   2. Set QSCANNER_GATEWAY_URL below to match your Qualys account's gateway.

name: QScanner Container Security Scan

on:
  push:
    branches: [ main, qscanner-github-repo-scan ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  security-events: write   # required to upload SARIF results
  actions: read            # required by upload-sarif to fetch workflow-run info for fingerprinting

env:
  IMAGE_NAME: anmol-qscanner-repo-scan
  QSCANNER_GATEWAY_URL: https://gateway.qg1.apps.qualys.ca

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Download the QScanner binary onto the runner (needed for both scans below)
      - name: Download QScanner
        run: |
          curl -sSL -o download_qscanner.sh "https://www.qualys.com/qscanner/download/latest/download_qscanner.sh"
          chmod +x download_qscanner.sh
          ./download_qscanner.sh

      # Step 2: Scan the source code FIRST — dependency + compliance scan,
      # before anything is built. Scans the already-checked-out local
      # workspace (avoids re-cloning, which fails auth on private repos).
      # Uses client-id/secret + gateway-url auth, since this talks to the
      # Code-to-Cloud gateway rather than the pod/access-token endpoint.
      - name: Code scan with QScanner
        env:
          QUALYS_CLIENT_ID: ${{ secrets.QUALYS_CLIENT_ID }}
          QUALYS_CLIENT_SECRET: ${{ secrets.QUALYS_CLIENT_SECRET }}
        run: |
          ./linux-amd64/qscanner \
            --gateway-url "${{ env.QSCANNER_GATEWAY_URL }}" \
            --client-id "$QUALYS_CLIENT_ID" \
            --client-secret "$QUALYS_CLIENT_SECRET" \
            code "${{ github.workspace }}" \
            --scan-types sca,compliance \
            --compliance-benchmarks AI_NIST_RMF,AI_EU_ACT,AI_PCI_DSS \
            --skip-verify-tls

      # Step 3: Build the container image AFTER the code scan passes
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./backend

      # Step 4: Scan the built image and generate a SARIF report
      - name: Scan image with QScanner
        env:
          QUALYS_CLIENT_ID: ${{ secrets.QUALYS_CLIENT_ID }}
          QUALYS_CLIENT_SECRET: ${{ secrets.QUALYS_CLIENT_SECRET }}
        run: |
          ./linux-amd64/qscanner \
            --gateway-url "${{ env.QSCANNER_GATEWAY_URL }}" \
            --client-id "$QUALYS_CLIENT_ID" \
            --client-secret "$QUALYS_CLIENT_SECRET" \
            --skip-verify-tls \
            image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --report-format sarif

      # QScanner writes reports to ~/qualys/qscanner/data/, not the working directory
      - name: Locate SARIF report
        id: locate_sarif
        run: |
          REPORT_PATH=$(find "$HOME" -maxdepth 6 -iname "*Report.sarif.json" 2>/dev/null | head -n 1)
          if [ -z "$REPORT_PATH" ]; then
            echo "No SARIF report found — searched under \$HOME" >&2
            find "$HOME" -iname "*sarif*" 2>/dev/null
            exit 1
          fi
          echo "Found: $REPORT_PATH"
          echo "path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

      # Step 5: Upload the SARIF report so findings show up under Security > Code scanning
      - name: Upload SARIF report to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.locate_sarif.outputs.path }}
