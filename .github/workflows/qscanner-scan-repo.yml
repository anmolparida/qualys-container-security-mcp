# .github/workflows/qscanner-scan.yml
#
# Scans a container image with Qualys QScanner during CI and publishes
# the results to GitHub's Security > Code scanning tab.
#
# Setup required before this workflow will run successfully:
#   1. Create a Qualys access token: Qualys Platform > Configurations > Access Token
#   2. Add it as a repo secret named QUALYS_ACCESS_TOKEN
#      (Settings > Secrets and variables > Actions > New repository secret)
#   3. Set QSCANNER_POD below to your Qualys platform POD (e.g. US1, US3, EU1).
#      See "Appendix: POD Identifiers" in the QScanner docs for the full list.
#   4. Update the "Download QScanner" step with the actual download URL/method
#      for your account (see https://www.qualys.com/downloads/qscanner).

name: QScanner Container Security Scan

on:
  push:
    branches: [ main, qscanner-github-repo-scan ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: read
  security-events: write   # required to upload SARIF results

env:
  IMAGE_NAME: anmol-qscanner-repo-scan
  QSCANNER_POD: CA1

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1-2: Build code and produce the container image artifact
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Step 3: Download the QScanner binary onto the runner
      - name: Download QScanner
        run: |
          curl -sSL -o download_qscanner.sh "https://www.qualys.com/qscanner/download/latest/download_qscanner.sh"
          chmod +x download_qscanner.sh
          ./download_qscanner.sh

      # Step 4: Scan the locally built image and generate a SARIF report
      - name: Scan image with QScanner
        env:
          QUALYS_ACCESS_TOKEN: ${{ secrets.QUALYS_ACCESS_TOKEN }}
        run: |
          ./qscanner --pod "${{ env.QSCANNER_POD }}" image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --report-format sarif

      # QScanner names the report file dynamically, so locate it before upload
      - name: Locate SARIF report
        id: locate_sarif
        run: |
          REPORT_PATH=$(find . -maxdepth 4 -iname "*Report.sarif.json" | head -n 1)
          if [ -z "$REPORT_PATH" ]; then
            echo "No SARIF report found" >&2
            exit 1
          fi
          echo "path=$REPORT_PATH" >> "$GITHUB_OUTPUT"

      # Step 5: Upload the SARIF report so findings show up under Security > Code scanning
      - name: Upload SARIF report to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.locate_sarif.outputs.path }}
